name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================
  # Site vitrine (raiz, deploy GitHub Pages)
  # =========================================================
  lint-and-typecheck:
    name: Vitrine — Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  unit-tests:
    name: Vitrine — Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  build-check:
    name: Vitrine — Build (GitHub Pages export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Mesmo comando do deploy (pages.yml), garante que o export
      # estático não quebra antes do deploy rodar.
      - name: Build
        run: npm run build:pages

      - name: Check output exists
        run: test -f out/index.html && echo "Export OK"

  # =========================================================
  # Plataforma multi-tenant (monorepo apps/ + packages/)
  # =========================================================
  platform-typecheck:
    name: Platform — TypeScript (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Instala workspaces (npm workspaces nativo resolve workspace:*)
      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      # Typecheck strict do monorepo (turbo roda nos packages + apps)
      - name: Typecheck
        run: npm run monorepo:typecheck
